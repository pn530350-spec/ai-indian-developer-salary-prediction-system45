 
<script>
const form = document.getElementById("salaryForm");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const role = document.getElementById("role").value;
  const exp = Number(document.getElementById("experience").value);
  const city = Number(document.getElementById("city").value);
  const company = Number(document.getElementById("company").value);
  const education = Number(document.getElementById("education").value);
  const skill = Number(document.getElementById("skill").value);

  const salaryList = {
    frontend: 6.5,
    backend: 7.5,
    fullstack: 7.2,
    mobile: 7,
    data: 9,
    devops: 8.5,
    qa: 5.5,
    cyber: 8
  };

  let experienceFactor = 0.62;

  if (exp === 1) experienceFactor = 0.78;
  if (exp === 2) experienceFactor = 0.92;
  if (exp === 4) experienceFactor = 1.28;
  if (exp === 7) experienceFactor = 1.8;
  if (exp >= 10) experienceFactor = 2.35;

  const salary = Math.max(
    2.4,
    salaryList[role] * experienceFactor *
    city * company * education * skill
  );

  const low = salary * 0.82;
  const high = salary * 1.22;

  document.getElementById("annual").innerHTML =
    "₹" + salary.toFixed(1) + " <small>LPA</small>";

  document.getElementById("range").textContent =
    "सालाना अनुमान: ₹" + (low * 100000).toLocaleString("en-IN") +
    " से ₹" + (high * 100000).toLocaleString("en-IN");

  document.getElementById("monthly").textContent =
    "₹" + Math.round(salary * 100000 / 12)
      .toLocaleString("en-IN");

  document.getElementById("level").textContent =
    exp === 0 ? "नया डेवलपर" :
    exp <= 2 ? "जूनियर" :
    exp <= 5 ? "मिड-लेवल" :
    exp <= 8 ? "सीनियर" : "लीड डेवलपर";

  const score = Math.min(100, Math.round(salary / 35 * 100));

  document.getElementById("percent").textContent = score + "%";
  document.getElementById("barFill").style.width = score + "%";

  document.getElementById("placeholder").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("tipsList").innerHTML = `
    <li>JavaScript, Python या अपनी चुनी हुई भाषा में अभ्यास करें।</li>
    <li>अपने प्रोजेक्ट बनाकर GitHub पर अपलोड करें।</li>
    <li>इंटरव्यू और समस्या हल करने का अभ्यास करें।</li>
  `;
});
</script>
</body>
</html>
